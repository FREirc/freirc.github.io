<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ufnAIchat v0.1a</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
        }
        
        /* 导航栏样式 */
        .navbar {
            background-color: #2c3e50;
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .nav-title {
            font-size: 18px;
            font-weight: bold;
        }
        
        /* 下拉菜单容器 */
        .dropdown {
            position: relative;
            display: inline-block;
        }
        
        .dropdown-btn {
            background-color: transparent;
            color: white;
            border: none;
            padding: 8px 15px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            display: flex;
            align-items: center;
            width: 100%;
            text-align: left;
        }
        
        .dropdown-btn:hover {
            background-color: rgba(255,255,255,0.1);
        }
        
        .dropdown-content {
            display: none;
            position: absolute;
            left: 0;
            top: 100%;
            background-color: white;
            min-width: 200px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            z-index: 1;
            border-radius: 4px;
            margin-top: 0;
            color: #333;
            padding-top: 5px;
        }
        
        .dropdown-content.show {
            display: block;
        }
        
        .dropdown-item {
            padding: 10px 15px;
            text-decoration: none;
            display: block;
            cursor: pointer;
            font-size: 14px;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }
        
        .dropdown-item:hover {
            background-color: #f1f1f1;
        }
        
        .dropdown-divider {
            height: 1px;
            background-color: #e0e0e0;
            margin: 5px 0;
        }
        
        /* API密钥设置弹窗 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        
        .modal-content {
            background-color: white;
            margin: 15% auto;
            padding: 20px;
            border-radius: 8px;
            width: 80%;
            max-width: 500px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .close:hover {
            color: #000;
        }
        
        /* API密钥输入容器 */
        .api-key-input-container {
            position: relative;
            margin: 15px 0;
        }
        
        #api-key-input {
            width: 100%;
            padding: 10px 40px 10px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        
        /* 显示/隐藏按钮样式 */
        #toggle-api-key {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: #666;
        }
        
        /* 聊天界面样式 */
        .chat-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            height: calc(100vh - 80px);
            display: flex;
            flex-direction: column;
        }
        
        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background-color: white;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        
        .message {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }
        
        .message.user {
            align-items: flex-end;
        }
        
        .message.ai {
            align-items: flex-start;
        }
        
        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
        }
        
        .message.user .message-content {
            background-color: #3498db;
            color: white;
            border-bottom-right-radius: 4px;
        }
        
        .message.ai .message-content {
            background-color: #ecf0f1;
            color: #333;
            border-bottom-left-radius: 4px;
        }
        
        /* 时间戳样式 */
        .timestamp {
            font-size: 11px;
            color: #999;
            margin-top: 4px;
            margin-bottom: 8px;
            text-align: right;
            padding: 0 16px;
            width: 70%;
        }
        
        .message.ai .timestamp {
            text-align: left;
        }
        
        /* 正在运算状态样式 */
        .thinking-indicator {
            display: flex;
            align-items: center;
            color: #999;
            font-size: 14px;
            margin-bottom: 15px;
        }
        
        .thinking-dots {
            display: inline-flex;
            margin-left: 8px;
        }
        
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #999;
            margin: 0 2px;
            animation: pulse 1.4s infinite ease-in-out both;
        }
        
        .dot:nth-child(1) {
            animation-delay: -0.32s;
        }
        
        .dot:nth-child(2) {
            animation-delay: -0.16s;
        }
        
        @keyframes pulse {
            0%, 80%, 100% {
                transform: scale(0);
            }
            40% {
                transform: scale(1);
            }
        }
        
        .chat-input-area {
            display: flex;
            gap: 10px;
        }
        
        #message-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 25px;
            font-size: 14px;
            resize: none;
            min-height: 50px;
            max-height: 150px;
        }
        
        #send-button {
            padding: 12px 25px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            align-self: flex-end;
        }
        
        #send-button:hover {
            background-color: #2980b9;
        }
        
        /* 会话列表样式 */
        .session-list {
            margin-top: 10px;
            max-height: 200px;
            overflow-y: auto;
        }
        
        .session-item {
            padding: 8px 16px;
            cursor: pointer;
            font-size: 13px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .session-item:hover {
            background-color: #f9f9f9;
        }
        
        .session-item.active {
            background-color: #e8f4fd;
            font-weight: bold;
        }
        
        /* 删除按钮样式 */
        .delete-session-btn {
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 16px;
            padding: 2px 5px;
            border-radius: 3px;
            margin-left: 10px;
        }
        
        .delete-session-btn:hover {
            background-color: #ffeeee;
            color: #ff4d4f;
        }
        
        /* 状态消息 */
        .status-message {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin: 20px 0;
        }
        
        /* Markdown样式 */
        .message-content h1, .message-content h2, .message-content h3 {
            margin: 10px 0;
        }
        
        .message-content h1 {
            font-size: 24px;
            border-bottom: 1px solid #eee;
        }
        
        .message-content h2 {
            font-size: 20px;
            border-bottom: 1px solid #eee;
        }
        
        .message-content h3 {
            font-size: 18px;
        }
        
        .message-content strong {
            font-weight: bold;
        }
        
        .message-content em {
            font-style: italic;
        }
        
        .message-content ul, .message-content ol {
            padding-left: 20px;
            margin: 10px 0;
        }
        
        .message-content li {
            margin: 5px 0;
        }
        
        .message-content code {
            background-color: rgba(27, 31, 35, 0.05);
            padding: 2px 4px;
            border-radius: 3px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 0.9em;
        }
        
        .message-content pre {
            background-color: rgba(27, 31, 35, 0.05);
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
            margin: 10px 0;
        }
        
        .message-content pre code {
            background-color: transparent;
            padding: 0;
        }
        
        .message-content a {
            color: #3498db;
            text-decoration: none;
        }
        
        .message-content a:hover {
            text-decoration: underline;
        }
        
        .message-content blockquote {
            border-left: 4px solid #ddd;
            padding-left: 10px;
            color: #666;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <div class="navbar">
        <div class="nav-title">ufnAIchat v0.1a</div>
        
        <!-- 下拉菜单 -->
        <div class="dropdown">
            <button class="dropdown-btn">
                &emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;菜单 ▼
            </button>
            <div class="dropdown-content" id="dropdown-content">
                <button class="dropdown-item" id="api-key-btn">API密钥设置</button>
                <div class="dropdown-divider"></div>
                <button class="dropdown-item" id="new-session-btn">新建会话</button>
                <div class="dropdown-divider"></div>
                <div class="session-list" id="session-list"></div>
            </div>
        </div>
    </div>
    
    <!-- API密钥设置弹窗 -->
    <div id="api-key-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>设置API密钥</h2>
            <p>请输入密钥：</p>
            <div class="api-key-input-container">
                <input type="text" id="api-key-input" placeholder="输入API密钥">
                <button id="toggle-api-key">o</button>
            </div>
            <button id="save-api-key" style="padding: 10px 20px; background-color: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer;">保存</button>
            <p id="api-key-message" style="margin-top: 10px;"></p>
        </div>
    </div>
    
    <!-- 聊天界面 -->
    <div class="chat-container">
        <div class="chat-history" id="chat-history">
            <div class="status-message">在开始前，请先在右上角菜单设置密钥</div>
        </div>
        <div class="chat-input-area">
            <textarea id="message-input" placeholder="输入..."></textarea>
            <button id="send-button">发送</button>
        </div>
    </div>
    
    <script>
        // DOM元素
        const apiKeyModal = document.getElementById('api-key-modal');
        const apiKeyBtn = document.getElementById('api-key-btn');
        const closeBtn = document.querySelector('.close');
        const apiKeyInput = document.getElementById('api-key-input');
        const toggleApiKeyBtn = document.getElementById('toggle-api-key');
        const saveApiKeyBtn = document.getElementById('save-api-key');
        const apiKeyMessage = document.getElementById('api-key-message');
        const newSessionBtn = document.getElementById('new-session-btn');
        const sessionList = document.getElementById('session-list');
        const chatHistory = document.getElementById('chat-history');
        const messageInput = document.getElementById('message-input');
        const sendButton = document.getElementById('send-button');
        const dropdown = document.querySelector('.dropdown');
        const dropdownBtn = document.querySelector('.dropdown-btn');
        const dropdownContent = document.getElementById('dropdown-content');
        
        // 当前会话ID
        let currentSessionId = null;
        // API密钥显示状态
        let isApiKeyVisible = false;
        
        // 下拉菜单控制
        function showDropdown() {
            dropdownContent.classList.add('show');
        }
        
        function hideDropdown() {
            dropdownContent.classList.remove('show');
        }
        
        dropdownBtn.addEventListener('mouseenter', showDropdown);
        dropdownContent.addEventListener('mouseenter', showDropdown);
        dropdown.addEventListener('mouseleave', hideDropdown);
        
        // 点击页面其他地方关闭下拉菜单
        document.addEventListener('click', (e) => {
            if (!dropdown.contains(e.target)) {
                hideDropdown();
            }
        });
        
        // API密钥显示/隐藏切换
        toggleApiKeyBtn.addEventListener('click', () => {
            isApiKeyVisible = !isApiKeyVisible;
            
            if (isApiKeyVisible) {
                apiKeyInput.type = 'text';
                toggleApiKeyBtn.textContent = 'o';
                toggleApiKeyBtn.title = '隐藏密钥';
            } else {
                apiKeyInput.type = 'password';
                toggleApiKeyBtn.textContent = 'x';
                toggleApiKeyBtn.title = '显示密钥';
            }
        });
        
        // 初始化应用
        function initApp() {
            // 检查是否有API密钥
            const savedApiKey = localStorage.getItem('siliconFlowApiKey');
            if (savedApiKey) {
                apiKeyInput.value = savedApiKey;
            }
            
            // 加载会话列表
            loadSessions();
            
            // 检查是否有上次使用的会话
            const lastSessionId = localStorage.getItem('lastSessionId');
            if (lastSessionId) {
                switchSession(lastSessionId);
            } else {
                // 创建默认会话
                createNewSession();
            }
        }
        
        // API密钥管理
        apiKeyBtn.addEventListener('click', () => {
            apiKeyModal.style.display = 'block';
            // 默认隐藏API密钥
            apiKeyInput.type = 'password';
            toggleApiKeyBtn.textContent = 'x';
            toggleApiKeyBtn.title = '显示密钥';
            isApiKeyVisible = false;
            hideDropdown();
        });
        
        closeBtn.addEventListener('click', () => {
            apiKeyModal.style.display = 'none';
        });
        
        window.addEventListener('click', (e) => {
            if (e.target === apiKeyModal) {
                apiKeyModal.style.display = 'none';
            }
        });
        
        saveApiKeyBtn.addEventListener('click', () => {
            const apiKey = apiKeyInput.value.trim();
            if (apiKey) {
                localStorage.setItem('siliconFlowApiKey', apiKey);
                apiKeyMessage.textContent = 'API密钥已保存！';
                apiKeyMessage.style.color = 'green';
                setTimeout(() => {
                    apiKeyModal.style.display = 'none';
                }, 1000);
            } else {
                apiKeyMessage.textContent = '请输入有效的SiliconFlow标准API密钥';
                apiKeyMessage.style.color = 'red';
            }
        });
        
        // 会话管理
        function createNewSession() {
            const sessionId = Date.now().toString();
            const sessionName = `会话 ${new Date().toLocaleString()}`;
            
            // 保存新会话
            const sessions = getSessions();
            sessions[sessionId] = {
                name: sessionName,
                createdAt: new Date().toISOString(),
                messages: []
            };
            saveSessions(sessions);
            
            // 切换到新会话
            switchSession(sessionId);
            
            // 更新会话列表
            loadSessions();
            
            // 关闭下拉菜单
            hideDropdown();
        }
        
        function switchSession(sessionId) {
            currentSessionId = sessionId;
            localStorage.setItem('lastSessionId', sessionId);
            
            // 加载聊天记录
            loadChatHistory();
            
            // 更新会话列表显示
            updateSessionListDisplay();
            
            // 关闭下拉菜单
            hideDropdown();
        }
        
        function loadSessions() {
            const sessions = getSessions();
            sessionList.innerHTML = '';
            
            // 按创建时间倒序排列
            const sortedSessionIds = Object.keys(sessions).sort((a, b) => {
                return new Date(sessions[b].createdAt) - new Date(sessions[a].createdAt);
            });
            
            sortedSessionIds.forEach(sessionId => {
                const session = sessions[sessionId];
                const sessionItem = document.createElement('div');
                sessionItem.className = 'session-item';
                sessionItem.dataset.sessionId = sessionId;
                
                // 创建会话名称元素
                const sessionName = document.createElement('span');
                sessionName.textContent = session.name;
                sessionName.style.flex = '1';
                
                // 创建删除按钮
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-session-btn';
                deleteBtn.textContent = 'x';
                deleteBtn.title = '删除会话';
                
                // 添加删除事件
                deleteBtn.addEventListener('click', (e) => {
                    e.stopPropagation(); // 阻止事件冒泡，避免触发会话切换
                    deleteSession(sessionId);
                });
                
                // 添加会话切换事件
                sessionName.addEventListener('click', () => {
                    switchSession(sessionId);
                });
                
                // 组装会话项
                sessionItem.appendChild(sessionName);
                sessionItem.appendChild(deleteBtn);
                sessionList.appendChild(sessionItem);
            });
            
            updateSessionListDisplay();
        }
        
        function updateSessionListDisplay() {
            const sessionItems = document.querySelectorAll('.session-item');
            sessionItems.forEach(item => {
                if (item.dataset.sessionId === currentSessionId) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
        }
        
        // 删除会话函数
        function deleteSession(sessionId) {
            // 确认对话框
            if (confirm('确定要删除这个会话吗？删除后将无法恢复。')) {
                const sessions = getSessions();
                
                // 删除会话
                delete sessions[sessionId];
                saveSessions(sessions);
                
                // 如果删除的是当前会话，切换到另一个会话或创建新会话
                if (currentSessionId === sessionId) {
                    const remainingSessionIds = Object.keys(sessions);
                    if (remainingSessionIds.length > 0) {
                        switchSession(remainingSessionIds[0]);
                    } else {
                        createNewSession();
                    }
                }
                
                // 更新会话列表
                loadSessions();
            }
        }
        
        function getSessions() {
            const sessionsJson = localStorage.getItem('chatSessions');
            return sessionsJson ? JSON.parse(sessionsJson) : {};
        }
        
        function saveSessions(sessions) {
            localStorage.setItem('chatSessions', JSON.stringify(sessions));
        }
        
        // 格式化时间戳
        function formatTimestamp(timestampStr) {
            const date = new Date(timestampStr);
            return date.toLocaleString('zh-CN', { 
                year: 'numeric', 
                month: '2-digit', 
                day: '2-digit',
                hour: '2-digit', 
                minute: '2-digit',
                second: '2-digit'
            });
        }
        
        // Markdown解析函数
        function parseMarkdown(text) {
            // 转换标题
            text = text.replace(/^# (.*$)/gm, '<h1>$1</h1>');
            text = text.replace(/^## (.*$)/gm, '<h2>$1</h2>');
            text = text.replace(/^### (.*$)/gm, '<h3>$1</h3>');
            
            // 转换粗体和斜体
            text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            text = text.replace(/\*(.*?)\*/g, '<em>$1</em>');
            
            // 转换无序列表
            text = text.replace(/^\* (.*$)/gm, '<ul><li>$1</li></ul>');
            text = text.replace(/<\/ul>\s*<ul>/g, '');
            
            // 转换有序列表
            text = text.replace(/^\d+\. (.*$)/gm, '<ol><li>$1</li></ol>');
            text = text.replace(/<\/ol>\s*<ol>/g, '');
            
            // 转换链接
            text = text.replace(/\[([^\]]+)\]\(([^\)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
            
            // 转换行内代码
            text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
            
            // 转换代码块
            text = text.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
            
            // 转换引用
            text = text.replace(/^> (.*$)/gm, '<blockquote>$1</blockquote>');
            
            // 转换换行
            text = text.replace(/\n/g, '<br>');
            
            return text;
        }
        
        // 聊天功能
        function loadChatHistory() {
            const sessions = getSessions();
            const currentSession = sessions[currentSessionId];
            
            if (!currentSession) {
                chatHistory.innerHTML = '<div class="status-message">会话不存在</div>';
                return;
            }
            
            if (currentSession.messages.length === 0) {
                chatHistory.innerHTML = '<div class="status-message">新会话</div>'
                return;
            }
            
            chatHistory.innerHTML = '';
            currentSession.messages.forEach(message => {
                addMessageToHistory(message.content, message.sender, message.timestamp);
            });
            
            // 滚动到底部
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }
        
        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;
            
            const apiKey = localStorage.getItem('siliconFlowApiKey');
            if (!apiKey) {
                alert('请先在菜单中设置API密钥');
                return;
            }
            
            // 添加用户消息到聊天记录
            addMessageToHistory(message, 'user');
            messageInput.value = '';
            
            // 保存到本地存储
            saveMessage(message, 'user');
            
            // 添加"正在运算..."状态
            const thinkingIndicator = document.createElement('div');
            thinkingIndicator.className = 'thinking-indicator';
            thinkingIndicator.innerHTML = '正在运算...<div class="thinking-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
            thinkingIndicator.id = 'thinking-indicator';
            chatHistory.appendChild(thinkingIndicator);
            
            // 滚动到底部
            chatHistory.scrollTop = chatHistory.scrollHeight;
            
            // 发送API请求
            try {
                // 获取当前会话的所有消息，转换为API要求的格式
                const sessions = getSessions();
                const currentSession = sessions[currentSessionId];
                const messagesForApi = currentSession.messages.map(msg => ({
                    role: msg.sender === 'user' ? 'user' : 'assistant',
                    content: msg.content
                }));
                
                const response = await fetch('https://api.siliconflow.cn/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'deepseek-ai/DeepSeek-V3.2',
                        messages: messagesForApi,
                        temperature: 0.7
                    })
                });
                
                if (!response.ok) {
                    throw new Error('API请求失败');
                }
                
                // 移除"正在运算..."状态
                thinkingIndicator.remove();
                
                const data = await response.json();
                const aiResponse = data.choices[0].message.content;
                
                // 添加AI响应到聊天记录
                addMessageToHistory(aiResponse, 'ai');
                
                // 保存到本地存储
                saveMessage(aiResponse, 'ai');
                
            } catch (error) {
                // 移除"正在运算..."状态
                thinkingIndicator.remove();
                
                addMessageToHistory('抱歉，请求失败: ' + error.message, 'ai');
                console.error('API请求错误:', error);
            }
        }
        
        function addMessageToHistory(content, sender, timestamp = null) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            
            // 使用Markdown解析函数转换内容
            contentDiv.innerHTML = parseMarkdown(content);
            
            messageDiv.appendChild(contentDiv);
            
            // 添加时间戳
            const timeDiv = document.createElement('div');
            timeDiv.className = 'timestamp';
            
            if (timestamp) {
                // 如果提供了时间戳，使用它
                timeDiv.textContent = formatTimestamp(timestamp);
            } else {
                // 否则使用当前时间
                const now = new Date();
                timeDiv.textContent = formatTimestamp(now.toISOString());
            }
            
            messageDiv.appendChild(timeDiv);
            chatHistory.appendChild(messageDiv);
            
            // 滚动到底部
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }
        
        function saveMessage(content, sender) {
            const sessions = getSessions();
            const currentSession = sessions[currentSessionId];
            
            currentSession.messages.push({
                content: content,
                sender: sender,
                timestamp: new Date().toISOString()
            });
            
            saveSessions(sessions);
        }
        
        // 事件监听
        newSessionBtn.addEventListener('click', createNewSession);
        sendButton.addEventListener('click', sendMessage);
        
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        
        // 页面加载完成后初始化
        window.addEventListener('load', initApp);
    </script>
</body>
</html>
